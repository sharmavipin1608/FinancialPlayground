name: CI

on:
  push:
    branches: ["main", "add-ci-workflow"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        env:
          SNAPTRADE_CLIENT_ID: dummy
          SNAPTRADE_CONSUMER_KEY: dummy
          ALPACA_API_KEY: dummy
          ALPACA_API_SECRET: dummy
          DATABASE_URL: sqlite:///./test.db
        run: pytest tests/ -v
